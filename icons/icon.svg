<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Daisy Days">
  <title>Daisy Days</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#fff8fb"/>
      <stop offset="100%" stop-color="#ffd4e2"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe8f1"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- ก้านและใบ -->
  <path d="M256 300 C 252 360 252 400 256 436" stroke="#7fb286" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M254 368 C 214 356 196 330 198 304 C 226 306 250 332 254 368 Z" fill="#7fb286"/>
  <path d="M258 398 C 298 390 318 366 318 342 C 290 342 264 364 258 398 Z" fill="#8fc497"/>

  <!-- กลีบดอกเดซี่ 12 กลีบ -->
  <g fill="url(#petal)" stroke="#f3c6d8" stroke-width="3">
    <g transform="translate(256 216)">
      <ellipse cx="0" cy="-74" rx="27" ry="60"/>
      <ellipse cx="0" cy="-74" rx="27" ry="60" transform="rotate(30)"/>
      <ellipse cx="0" cy="-74" rx="27" ry="60" transform="rotate(60)"/>
      <ellipse cx="0" cy="-74" rx="27" ry="60" transform="rotate(90)"/>
      <ellipse cx="0" cy="-74" rx="27" ry="60" transform="rotate(120)"/>
      <ellipse cx="0" cy="-74" rx="27" ry="60" transform="rotate(150)"/>
      <ellipse cx="0" cy="-74" rx="27" ry="60" transform="rotate(180)"/>
      <ellipse cx="0" cy="-74" rx="27" ry="60" transform="rotate(210)"/>
      <ellipse cx="0" cy="-74" rx="27" ry="60" transform="rotate(240)"/>
      <ellipse cx="0" cy="-74" rx="27" ry="60" transform="rotate(270)"/>
      <ellipse cx="0" cy="-74" rx="27" ry="60" transform="rotate(300)"/>
      <ellipse cx="0" cy="-74" rx="27" ry="60" transform="rotate(330)"/>
    </g>
  </g>

  <!-- เกสรกลางดอก -->
  <circle cx="256" cy="216" r="46" fill="#fdf0c7"/>
  <circle cx="256" cy="216" r="46" fill="none" stroke="#e8769b" stroke-width="5"/>
  <circle cx="256" cy="216" r="22" fill="#e8769b"/>
</svg>
